<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>SnapCompass</title>
<link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="head">
    <div class="logo">
      <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/>
          </linearGradient>
        </defs>
        <circle cx="16" cy="16" r="13" fill="none" stroke="url(#g)" stroke-width="2.4"/>
        <path d="M16 6 L20 16 L16 26 L12 16 Z" fill="url(#g)" opacity=".85"/>
        <circle cx="16" cy="16" r="2.4" fill="#fff"/>
      </svg>
      <div>
        <strong>SnapCompass</strong>
        <span class="ver">v1.0</span>
      </div>
    </div>
    <button id="openEditor" class="ghost" title="Open blank editor">Editor</button>
  </header>

  <main>
    <div class="capture-grid">
      <button class="cap primary" data-action="capture-visible">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="12" cy="12" r="3.2"/></svg>
        <span>Visible area</span>
      </button>
      <button class="cap" data-action="capture-fullpage">
        <svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2.5"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
        <span>Full page</span>
      </button>
      <button class="cap" data-action="capture-region">
        <svg viewBox="0 0 24 24"><path d="M4 9V5.5A1.5 1.5 0 0 1 5.5 4H9M15 4h3.5A1.5 1.5 0 0 1 20 5.5V9M20 15v3.5a1.5 1.5 0 0 1-1.5 1.5H15M9 20H5.5A1.5 1.5 0 0 1 4 18.5V15"/></svg>
        <span>Select region</span>
      </button>
    </div>

    <section class="rec" id="recSection">
      <div class="rec-head">
        <h3>Screen recording</h3>
        <div class="seg" id="sourceSeg">
          <button data-source="tab" class="on">Tab</button>
          <button data-source="desktop">Desktop</button>
        </div>
      </div>
      <div class="rec-opts">
        <label class="field">
          <span>Format</span>
          <select id="format">
            <option value="mp4">MP4 (fast)</option>
            <option value="gif">GIF (loopable)</option>
          </select>
        </label>
        <label class="check"><input type="checkbox" id="audio" /> Include audio</label>
      </div>
      <button id="recBtn" class="rec-btn">
        <span class="dot"></span> Start recording
      </button>
      <p class="rec-status" id="recStatus" hidden></p>
    </section>

    <p class="err" id="err" hidden></p>
  </main>

  <footer class="foot">
    <span><kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>S</kbd> visible</span>
    <span><kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>F</kbd> full page</span>
    <span><kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>R</kbd> region</span>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
